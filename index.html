<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <meta
      name="description"
      content="Huddle landing page featuring a modern community-building platform. Engage with your audience and create meaningful connections through interactive discussions."
    />
    <meta
      name="keywords"
      content="Huddle, community platform, landing page, Frontend Mentor, web development, HTML, CSS, responsive design"
    />
    <meta name="author" content="Ruben de Man" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Huddle landing page with single introductory section
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="intro">
          <img class="intro__logo" src="./images/logo.svg" alt="Huddle logo" />
          <div class="intro__content">
            <div class="intro__image-container">
              <img
                class="intro__image"
                src="./images/illustration-mockups.svg"
                alt="Illustration showing community engagement"
                loading="lazy"
              />
            </div>
            <div class="intro__right">
              <h1 class="intro__title">
                Build The Community Your Fans Will Love
              </h1>
              <p class="intro__text">
                Huddle re-imagines the way we build communities. You have a
                voice, but so does your audience. Create connections with your
                users as you engage in genuine discussion.
              </p>
              <a href="#" class="intro__button">Register</a>
            </div>
          </div>
          <footer class="intro__footer">
            <ul class="intro__list">
              <li class="intro__item">
                <a href="#" aria-label="Visit our Facebook page"
                  ><img
                    class="intro__icon"
                    src="./images/icon-facebook.svg"
                    alt="Facebook"
                /></a>
              </li>
              <li class="intro__item">
                <a href="#" aria-label="Visit our Twitter page"
                  ><img
                    class="intro__icon"
                    src="./images/icon-twitter.svg"
                    alt="Twitter"
                /></a>
              </li>
              <li class="intro__item">
                <a href="#" aria-label="Visit our Instagram page"
                  ><img
                    class="intro__icon"
                    src="./images/icon-instagram.svg"
                    alt="Instagram"
                /></a>
              </li>
            </ul>
          </footer>
        </div>
      </div>
    </main>

    <footer class="attribution">
      <p class="attribution__text">
        Challenge by
        <a
          class="attribution__link"
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          class="attribution__link"
          href="https://rubendeman.nl"
          target="_blank"
          rel="noopener noreferrer"
          >Ruben de Man</a
        >.
      </p>
    </footer>
  </body>
</html>
